name: Actualizar datos

# Una vez al día y a mano. Instala el recolector fijado de curia_maxima,
# lo corre en la raíz de este repositorio y hace commit solo si los archivos
# quedaron distintos. Si la fuente falla, el recolector sale con código 1:
# este trabajo queda en rojo y no hay push, así que main conserva la serie anterior.

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Commit fijado de github.com/nlecarosg/curia_maxima (main, 23 oct 2026).
      CURIA_MAXIMA_REV: a3a8574575866423bec62e9b4b2ddc909cf8db44
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar que el recolector es público
        run: |
          set -euo pipefail
          codigo=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://github.com/nlecarosg/curia_maxima")
          if [ "$codigo" != "200" ]; then
            echo "curia_maxima no está público (HTTP ${codigo})."
            echo "No se instala el recolector y no se modifican los datos."
            exit 1
          fi

      - name: Comprobar que la revisión está fijada
        run: |
          set -euo pipefail
          if [[ "$CURIA_MAXIMA_REV" =~ ^[0-9a-f]{40}$ ]]; then
            exit 0
          fi
          if [[ "$CURIA_MAXIMA_REV" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            exit 0
          fi
          echo "CURIA_MAXIMA_REV=${CURIA_MAXIMA_REV} no es un commit ni un tag."
          echo "No se modifica ningún dato."
          exit 1

      - name: Instalar el recolector fijado
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/nlecarosg/curia_maxima.git@${CURIA_MAXIMA_REV}"

      - name: Recolectar en la raíz del repositorio
        run: |
          set -euo pipefail
          python -m curia_maxima --output "${GITHUB_WORKSPACE}"

      - name: Validar la salida
        run: |
          set -euo pipefail
          python -m pip install "jsonschema==4.26.0"
          python scripts/validar.py "${GITHUB_WORKSPACE}"

      - name: Commit si los archivos cambiaron
        run: |
          set -euo pipefail
          git add -- series raw
          if git diff --cached --quiet; then
            echo "Sin cambios en los archivos. No se hace commit."
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "datos: actualiza el índice de remuneraciones IR2023 del INE"
          git push
